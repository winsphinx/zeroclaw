name: Build zeroclaw (ARM64 + AMD64)

on:
  # 手动触发
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # 在此处添加额外的 cargo feature，多个用空格分隔
  EXTRA_FEATURES: "channel-qq plugins-wasm-cranelift"

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu   # ARM64：ARM服务器（交叉编译）
            cross: true
            gcc_pkg: gcc-aarch64-linux-gnu
            gxx_pkg: g++-aarch64-linux-gnu
            libc_pkg: libc6-dev-arm64-cross
            tool_prefix: aarch64-linux-gnu
          - target: x86_64-unknown-linux-gnu    # AMD64：原生，无需交叉工具链
            cross: false
            gcc_pkg: ""
            gxx_pkg: ""
            libc_pkg: ""
            tool_prefix: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # 注意：docs 翻译用的 git submodule 构建不需要，不用加 submodules

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compiler
        if: matrix.cross
        run: |
          sudo apt-get update
          # gcc 是交叉编译器，libc6-dev-*-cross 是对应架构的 C 库头文件
          # （ring 等 crate 编 C 代码时需要，缺了会报 bits/libc-header-start.h 找不到）
          # g++ 是 C++ 交叉编译器（zerocode 依赖树里有 crate 用 cc-rs 编 C++ 代码，
          # 缺了会报 failed to find tool "aarch64-linux-gnu-g++"）
          sudo apt-get install -y --no-install-recommends ${{ matrix.gcc_pkg }} ${{ matrix.gxx_pkg }} ${{ matrix.libc_pkg }}

      - name: Set cross linker
        if: matrix.cross
        run: |
          triple_upper=$(echo "${{ matrix.target }}" | tr '[:lower:]-' '[:upper:]_')
          linker="${{ matrix.tool_prefix }}-gcc"
          # 例如：CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          echo "CARGO_TARGET_${triple_upper}_LINKER=${linker}" >> "$GITHUB_ENV"
          echo "Using linker: ${linker}"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: |
          # 主二进制（根包；channel-qq 等 feature 只对它有效）
          cargo build --release --target ${{ matrix.target }} --features "$EXTRA_FEATURES"
          # zerocode TUI（独立二进制，无 feature，直接 -p 指定）
          cargo build --release --target ${{ matrix.target }} -p zerocode

      - name: Verify and strip
        run: |
          for name in zeroclaw zerocode; do
            bin="target/${{ matrix.target }}/release/$name"
            file "$bin"
            if [ -n "${{ matrix.tool_prefix }}" ]; then
              "${{ matrix.tool_prefix }}-strip" "$bin" || true
            else
              strip "$bin" || true
            fi
            ls -lh "$bin"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: zeroclaw-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/zeroclaw
            target/${{ matrix.target }}/release/zerocode
          if-no-files-found: error
